<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optimizador Dinamax - Pokémon GO</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css"
      integrity="sha512-v8QQ0YQ3H4K6Ic3PJkym91KoeNT5S3PnDKvqnwqFD1oiqIl653crGZplPdU5KKtHjO0QKcQ2aUlQZYjHczkmGw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card-custom {
        border-radius: 12px;
        border: 1px solid #e3e6f0;
      }
    </style>
  </head>
  <body>
    <div class="container py-4" style="max-width: 720px">
      <!-- Encabezado -->
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">
          <i class="fa-solid fa-bolt me-2"></i>Optimizador Dinamax
        </h3>
        <p class="text-muted small">
          Pokémon GO — Algoritmo de Árbol de Decisión
        </p>
      </div>

      <!-- Panel de Entrada (3 Datos) -->
      <div class="card card-custom shadow-sm p-3 mb-4 bg-white">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold small">
              <i
                class="fa-solid fa-battery-three-quarters text-warning me-1"></i
              >Energía Inicial (MP):
            </label>
            <input
              type="number"
              id="saldoIni"
              class="form-control"
              value="0"
              min="0"
              max="1700" />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold small">
              <i class="fa-solid fa-calendar-check text-success me-1"></i
              >Reclamado Hoy (Máx 800):
            </label>
            <input
              type="number"
              id="reclamosHoy"
              class="form-control"
              value="0"
              min="0"
              max="800" />
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold small">
              <i class="fa-solid fa-bullseye text-danger me-1"></i>Rango
              Objetivo Saldo Final (MP):
            </label>
            <div class="input-group">
              <span class="input-group-text bg-light small">Mín: 900</span>
              <input
                type="number"
                id="minSaldo"
                class="form-control"
                value="900"
                min="0" />
              <span class="input-group-text bg-light small">Máx: 1190</span>
              <input
                type="number"
                id="maxSaldo"
                class="form-control"
                value="1190"
                max="1200" />
            </div>
            <div class="form-text text-muted" style="font-size: 0.75rem">
              Solo se mostrarán rutas cuyo saldo final quede exactamente en este
              rango.
            </div>
          </div>
        </div>

        <button
          onclick="calcularArbol()"
          class="btn btn-primary w-100 mt-3 fw-bold">
          <i class="fa-solid fa-calculator me-2"></i>Calcular Rutas Óptimas
        </button>
      </div>

      <!-- Contenedor de Resultados -->
      <div id="resultadosContainer"></div>
    </div>

    <script>
      function calcularArbol() {
        const saldoInicial =
          parseInt(document.getElementById("saldoIni").value) || 0;
        const reclamosHoy =
          parseInt(document.getElementById("reclamosHoy").value) || 0;
        const minSaldo =
          parseInt(document.getElementById("minSaldo").value) || 900;
        const maxSaldo =
          parseInt(document.getElementById("maxSaldo").value) || 1190;

        const CAPACIDAD_MAX = 1700;
        const LIMITE_RECOLECCION = 1500;
        const MAX_DIARIO = 800;
        const RECOMPENSA_NODO = 120;
        const RECOMPENSA_CAMINATA = 300;
        const COSTO_1 = 250;
        const COSTO_3 = 400;

        const restanteDiarioIni = Math.max(0, MAX_DIARIO - reclamosHoy);
        let rutasEncontradas = [];

        // Definición de acciones para el árbol de decisión
        const ACCIONES = [
          {
            id: "cam",
            nombre: "Reclamar 2km (Caminata)",
            costo: 0,
            baseRec: RECOMPENSA_CAMINATA,
            icono: "fa-shoe-prints text-info",
          },
          {
            id: "c1",
            nombre: "Combate 1★",
            costo: COSTO_1,
            baseRec: RECOMPENSA_NODO,
            icono: "fa-star text-warning",
          },
          {
            id: "c3",
            nombre: "Combate 3★",
            costo: COSTO_3,
            baseRec: RECOMPENSA_NODO,
            icono: "fa-skull text-danger",
          },
        ];

        // Algoritmo de exploración recursiva de árbol
        function explorar(saldoActual, cupoDiario, historial) {
          // Filtrado por el rango deseado (900 a 1190 MP)
          if (
            historial.length > 0 &&
            saldoActual >= minSaldo &&
            saldoActual <= maxSaldo
          ) {
            rutasEncontradas.push({
              saldoFinal: saldoActual,
              cupoRestante: cupoDiario,
              pasos: [...historial],
            });
            return;
          }

          if (historial.length >= 4) return;

          for (let acc of ACCIONES) {
            let recPotencial =
              saldoActual < LIMITE_RECOLECCION
                ? Math.min(acc.baseRec, cupoDiario)
                : 0;
            let recEfectiva = Math.min(
              recPotencial,
              Math.max(0, CAPACIDAD_MAX - saldoActual),
            );
            let saldoAntesPago = saldoActual + recEfectiva;

            if (saldoAntesPago >= acc.costo) {
              let saldoFinal = saldoAntesPago - acc.costo;
              let nuevoCupo = cupoDiario - recEfectiva;

              // Evitar duplicar caminata consecutiva si dio 0 MP
              if (
                acc.id === "cam" &&
                recEfectiva === 0 &&
                historial.some(
                  (p) => p.accionId === "cam" && p.recolectado === 0,
                )
              ) {
                continue;
              }

              explorar(saldoFinal, nuevoCupo, [
                ...historial,
                {
                  accionId: acc.id,
                  nombre: acc.nombre,
                  icono: acc.icono,
                  saldoInicial: saldoActual,
                  recolectado: recEfectiva,
                  costo: acc.costo,
                  saldoFinal: saldoFinal,
                },
              ]);
            }
          }
        }

        explorar(saldoInicial, restanteDiarioIni, []);

        // Ordenar resultados: prioritariamente las rutas que cobraron caminata > 0, luego menos pasos
        rutasEncontradas.sort((a, b) => {
          let camA = a.pasos.some(
            (p) => p.accionId === "cam" && p.recolectado > 0,
          )
            ? 1
            : 0;
          let camB = b.pasos.some(
            (p) => p.accionId === "cam" && p.recolectado > 0,
          )
            ? 1
            : 0;
          if (camA !== camB) return camB - camA;
          return a.pasos.length - b.pasos.length;
        });

        // Renderizado de Resultados en la interfaz
        const container = document.getElementById("resultadosContainer");
        container.innerHTML = "";

        if (rutasEncontradas.length === 0) {
          container.innerHTML = `
          <div class="alert alert-warning text-center">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>No se encontraron rutas que terminen exactamente en el rango de <strong>${minSaldo} a ${maxSaldo} MP</strong>.
          </div>`;
          return;
        }

        let html = `<h5 class="fw-bold mb-3"><i class="fa-solid fa-route text-success me-2"></i>${rutasEncontradas.length} Ruta(s) Encontrada(s) [${minSaldo} - ${maxSaldo} MP]:</h5>`;

        rutasEncontradas.forEach((ruta, idx) => {
          const tieneCaminata = ruta.pasos.some(
            (p) => p.accionId === "cam" && p.recolectado > 0,
          );

          html += `
          <div class="card card-custom shadow-sm mb-3 bg-white">
            <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
              <span class="fw-bold text-dark">Opción ${idx + 1} (${ruta.pasos.length} pasos)</span>
              <div>
                ${tieneCaminata ? '<span class="badge bg-info text-dark me-1"><i class="fas fa-shoe-prints me-1"></i>Incluye 2km</span>' : ""}
                <span class="badge bg-success">Saldo Final: ${ruta.saldoFinal} MP</span>
              </div>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-sm table-hover mb-0 text-center align-middle" style="font-size: 0.85rem;">
                  <thead class="table-light">
                    <tr>
                      <th>Acción</th>
                      <th>Inicio</th>
                      <th>Recolección</th>
                      <th>Costo</th>
                      <th>Final</th>
                    </tr>
                  </thead>
                  <tbody>`;

          ruta.pasos.forEach((p) => {
            html += `
            <tr>
              <td class="text-start ps-3"><i class="fa-solid ${p.icono} me-1"></i>${p.nombre}</td>
              <td>${p.saldoInicial} MP</td>
              <td class="${p.recolectado > 0 ? "text-success fw-bold" : "text-muted"}">+${p.recolectado} MP</td>
              <td class="${p.costo > 0 ? "text-danger" : "text-muted"}">-${p.costo} MP</td>
              <td class="fw-bold">${p.saldoFinal} MP</td>
            </tr>`;
          });

          html += `
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer bg-light small text-muted text-end">
              Si reclamas los <strong>${restanteDiarioIni} MP</strong> pendientes tras esta ruta, quedarás en <strong>${ruta.saldoFinal} MP</strong>.
            </div>
          </div>`;
        });

        container.innerHTML = html;
      }

      // Ejecutar cálculo automático al cargar la página
      // document.addEventListener("DOMContentLoaded", calcularArbol);
    </script>
  </body>
</html>
